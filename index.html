<!DOCTYPE html>
<html lang="tk">
<head>

body {

  font-family: Arial, sans-serif;
  background: #f5f5f5;
}

header {
  background: #111;
  color: white;
  padding: 15px;
  font-size: 24px;
  font-weight: bold;
}

.search {
  padding: 15px;
  text-align: center;
}

.search input {
  width: 80%;
  padding: 12px;
  border-radius: 20px;
  border: 1px solid #ccc;
}

  padding: 15px;
}

.video {
  background: white;
  margin-bottom: 15px;
  border-radius: 10px;
  overflow: hidden;
}

.video img {
  width: 100%;
}

.video h3 {
  padding: 10px;
  margin: 0;

footer {
  text-align: center;
  padding: 20px;
  background: #111;

</head>

<body>

<img src="https://via.placeholder.com/600x300.png?text=VIDEO+1">

<div class="video">
<img src="https://via.placeholder.com/600x300.png?text=VIDEO+2">
